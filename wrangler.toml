name = "rzero-mail"
main = "src/index.ts"
compatibility_date = "2025-06-01"

workers_dev = true

# ---- Routes / Custom Domain (Optional) ----
# routes = [
#   { pattern = "yourdomain.com", custom_domain = true }
# ]

# ---- D1 Database ----
# Create database via: npx wrangler d1 create rzero-db
# Paste your database_id below:
[[d1_databases]]
binding = "DB"
database_name = "rzero-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# ---- Email Worker (Cloudflare Email Routing) ----
[email]
action = "process"

# ---- Environment Variables (NON-SECRET ONLY) ----
#
# Jangan taruh kredensial admin di sini. File ini ikut ter-commit, dan
# `wrangler deploy` menerbitkan setiap nilai di [vars] sebagai variabel biasa —
# jadi placeholder yang tertulis di repo berubah menjadi password yang benar-benar
# berlaku begitu file ini di-deploy apa adanya.
#
# Kredensial admin disimpan sebagai Worker secret (terenkripsi, tidak ikut repo):
#
#   wrangler secret put ADMIN_USERNAME
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put ADMIN_V2L_KEY
#   wrangler secret put ADMIN_SECRET
#
# Kode bersifat fail-closed: selama salah satu belum diset, /admin/action menolak
# dengan HTTP 503 dan pesan yang menyebut env mana yang kurang — bukan diam-diam
# memakai nilai default.
[vars]
APP_NAME = "RZero Mail"
MAIL_DOMAIN = "yourdomain.com"
WEB_HOST = "yourdomain.com"

# ---- Static Assets (Neo-Brutalism Web Frontend) ----
[assets]
directory = "./src/web"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"

# ---- Observability ----
[observability]
enabled = true
